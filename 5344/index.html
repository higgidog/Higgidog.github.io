<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5344 Westridge</title>
<script>
// ▼▼▼  The ONLY line you ever change: paste the app's /exec address between the quotes  ▼▼▼
var APP_URL = "https://script.google.com/macros/s/AKfycbxgD423_Ho8SxspCjJ0xMUNwJX95EqsnGPrgfcMvHe8fJc-7uKe-2a-1RyBJItlAzcD/exec";
// ▲▲▲  Every printed QR code follows this address  ▲▲▲

(function () {
  if (APP_URL.indexOf("https://script.google.com/") !== 0) return;
  var target = APP_URL + window.location.search;
  window.location.replace(target);
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.getElementById("go");
    a.href = target;
    a.style.display = "inline-block";
  });
})();
</script>
<style>
  body { margin: 0; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  p { color: #6b6f76; margin: 0 0 18px; }
  a { display: none; background: #c4561c; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <h1>5344 Westridge</h1>
  <p id="msg">Opening the room page…</p>
  <a id="go" href="#">Tap here if it doesn't open</a>
</div>
<script>
  if (APP_URL.indexOf("https://script.google.com/") !== 0) {
    document.getElementById("msg").textContent = "The room app address hasn't been set yet.";
  }
</script>
</body>
</html>
